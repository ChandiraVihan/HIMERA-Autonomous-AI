name: C++ Agent Tests
on:
  push:
  pull_request:
jobs:
  standalone-agent-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Demonstration
        run: ./build/himera_demo
      - name: Benchmark correctness check
        run: ./build/himera_benchmark
